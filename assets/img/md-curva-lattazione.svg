<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-label="Curva di lattazione: prodotti Meridoro consigliati per ciascuna fase del ciclo">
  <title>Curva di lattazione Meridoro</title>
  <rect width="760" height="340" fill="#3A2828"/>

  <!-- fasce -->
  <g font-family="Fredoka, sans-serif" text-anchor="middle">
    <g>
      <line x1="40" y1="20" x2="40" y2="34" stroke="#FFF7F1" stroke-width="1.2"/>
      <line x1="40" y1="27" x2="178" y2="27" stroke="#FFF7F1" stroke-width="1.2"/>
      <line x1="178" y1="20" x2="178" y2="34" stroke="#FFF7F1" stroke-width="1.2"/>
      <text x="109" y="54" font-size="12.5" fill="#D7B46A">FIBER<tspan fill="#FFF7F1">FEED</tspan></text>
      <text x="109" y="70" font-size="12.5" fill="#FFF7F1">PECORE PRIMA FASE</text>
      <text x="109" y="86" font-size="11" fill="#FFF7F1" opacity=".72">(2 - 3 mesi)</text>
    </g>
    <g>
      <line x1="184" y1="20" x2="184" y2="34" stroke="#FFF7F1" stroke-width="1.2"/>
      <line x1="184" y1="27" x2="428" y2="27" stroke="#FFF7F1" stroke-width="1.2"/>
      <line x1="428" y1="20" x2="428" y2="34" stroke="#FFF7F1" stroke-width="1.2"/>
      <text x="306" y="54" font-size="12.5" fill="#D7B46A">FIBER<tspan fill="#FFF7F1">FEED</tspan></text>
      <text x="306" y="70" font-size="12.5" fill="#FFF7F1">PECORE LATTAZIONE</text>
      <text x="306" y="86" font-size="12.5" fill="#FFF7F1">OVI-CAP 16P</text>
    </g>
    <g>
      <line x1="434" y1="20" x2="434" y2="34" stroke="#FFF7F1" stroke-width="1.2"/>
      <line x1="434" y1="27" x2="554" y2="27" stroke="#FFF7F1" stroke-width="1.2"/>
      <line x1="554" y1="20" x2="554" y2="34" stroke="#FFF7F1" stroke-width="1.2"/>
      <text x="494" y="54" font-size="12.5" fill="#D7B46A">FIBER<tspan fill="#FFF7F1">FEED</tspan></text>
      <text x="494" y="70" font-size="12.5" fill="#FFF7F1">PECORE</text>
      <text x="494" y="86" font-size="12.5" fill="#FFF7F1">SECONDA FASE</text>
    </g>
    <g>
      <line x1="560" y1="20" x2="560" y2="34" stroke="#FFF7F1" stroke-width="1.2"/>
      <line x1="560" y1="27" x2="720" y2="27" stroke="#FFF7F1" stroke-width="1.2"/>
      <line x1="720" y1="20" x2="720" y2="34" stroke="#FFF7F1" stroke-width="1.2"/>
      <text x="640" y="54" font-size="12.5" fill="#D7B46A">PREUNI<tspan fill="#FFF7F1">FEED</tspan></text>
      <text x="640" y="70" font-size="12.5" fill="#FFF7F1">OVI-CAP ASCIUTTA</text>
    </g>
  </g>

  <!-- asse e curva -->
  <line x1="40" y1="272" x2="724" y2="272" stroke="#FFF7F1" stroke-opacity=".35" stroke-width="1.5"/>
  <path d="M60 272 C 92 272, 142 142, 212 134 C 302 124, 382 162, 462 192 C 522 214, 566 230, 604 240"
        fill="none" stroke="#FFF7F1" stroke-width="3" stroke-linecap="round"/>
  <line x1="390" y1="168" x2="390" y2="272" stroke="#D7B46A" stroke-width="2"/>

  <!-- etichetta PreUnifeed pre-parto -->
  <g font-family="Fredoka, sans-serif" text-anchor="middle">
    <text x="662" y="206" font-size="12" fill="#D7B46A">PREUNI<tspan fill="#FFF7F1">FEED</tspan></text>
    <text x="662" y="220" font-size="12" fill="#FFF7F1">PRE-PARTO</text>
  </g>

  <!-- tappe -->
  <g fill="#FFF7F1" font-family="Roboto Flex, Roboto, sans-serif" font-size="10.5" text-anchor="middle">
    <circle cx="60" cy="272" r="6"/>
    <circle cx="212" cy="272" r="6"/>
    <circle cx="390" cy="272" r="6" fill="#D7B46A"/>
    <circle cx="462" cy="272" r="6"/>
    <circle cx="560" cy="272" r="6"/>
    <circle cx="660" cy="272" r="6"/>
    <text x="60" y="294" letter-spacing=".05em">PARTO</text>
    <text x="212" y="294" letter-spacing=".05em">DOPO PICCO</text>
    <text x="212" y="306" letter-spacing=".05em">LATTAZIONE</text>
    <text x="390" y="294" fill="#D7B46A" letter-spacing=".05em">MONTA</text>
    <text x="560" y="294" letter-spacing=".05em">ASCIUTTA</text>
    <text x="660" y="294" letter-spacing=".05em">PARTO</text>
  </g>

  <!-- mesi -->
  <g fill="#FFF7F1" fill-opacity=".62" font-family="Roboto Flex, Roboto, sans-serif" font-size="10" text-anchor="start">
    <text x="64" y="258" transform="rotate(-90 64 258)">Ottobre - Dicembre</text>
    <text x="216" y="258" transform="rotate(-90 216 258)">Gennaio - Febbraio</text>
    <text x="394" y="258" transform="rotate(-90 394 258)" fill="#D7B46A" fill-opacity="1">Met&#224; Maggio</text>
    <text x="466" y="258" transform="rotate(-90 466 258)">Met&#224; Giugno</text>
    <text x="564" y="258" transform="rotate(-90 564 258)">Settembre</text>
  </g>

  <text x="40" y="328" font-family="Roboto Flex, Roboto, sans-serif" font-size="10" fill="#FFF7F1" fill-opacity=".6">
    Nota: i mesi qui segnati sono solo indicativi del periodo.
  </text>
</svg>
